name: Docker Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate scripts
        run: |
          python -m py_compile fetch_tilt_telemetry.py transform_tilt_telemetry.py upload_to_upstream.py
          bash -n entrypoint.sh

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: bethel1base-puller:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
